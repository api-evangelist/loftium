name: Loftium
description: 'Loftium was a Seattle-based real-estate technology startup (founded 2017) that helped renters
  and aspiring homebuyers cover a down payment by hosting a room or unit on Airbnb and sharing the short-term
  rental income. It later pivoted to a rent-to-own model. Loftium was acquired by Flyhomes in February
  2023. It was surfaced as a portfolio company of threshold-ventures and added to the API Evangelist network
  as a stub. Enrichment pass (2026-07-20) found no public API, developer portal, or documentation: the
  loftium.com domain no longer serves company content and 301-redirects to unrelated parked domains, and
  no api/docs/developer subdomains resolve. No API surface exists to catalog.'
